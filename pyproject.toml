[project]
name = "contextops-enterprise-policy-intelligence"
version = "0.1.0"
description = "Enterprise Policy Intelligence Platform powered by multimodal RAG"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "alembic>=1.19.1",
    "azure-ai-projects>=2.0.0",
    "azure-identity>=1.25.3",
    "azure-storage-blob>=12.30.0",
    "docling>=2.120.3",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "langchain>=1.3.18",
    "langgraph>=1.2.11",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.61.1",
    "tiktoken>=0.14.0",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
asyncio_mode = "auto"
